        - heading [level=2] [ref=f4e45]:
          - text: A Vision Bornfrom
          - emphasis [ref=f4e46]: Passion
        - paragraph [ref=f4e47]: Grand Palais was founded in 2008 by Vikram Malhotra, a visionary hotelier who believed that every celebration deserved the grandeur of a five-star experience. Beginning with a single 2,000 sq ft hall in South Mumbai, the brand quickly became synonymous with uncompromising luxury.
        - blockquote [ref=f4e48]:
          - text: "\"A great celebration isn't measured in square feet. It's measured in the emotions it creates and the memories it leaves behind.\""
          - generic [ref=f4e49]: — Vikram Malhotra, Founder
        - paragraph [ref=f4e50]: Today, Grand Palais spans 85,000 sq ft across three floors, featuring seven distinct event spaces, two in-house restaurants, and a dedicated floral design studio — all under one magnificent roof in the heart of Bandra West.
