<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <script>
    (function(){var t=localStorage.getItem('grand-palais-theme');if(t){document.documentElement.setAttribute('data-theme',t);}else if(window.matchMedia('(prefers-color-scheme:light)').matches){document.documentElement.setAttribute('data-theme','light');}})();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>Page Not Found — Grand Palais</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="icon" href="https://images.unsplash.com/photo-1780337092772-d85ad9dc562c?auto=format&fit=crop&w=32&h=32&q=80" />
  <style>
    :root { --page-bg: var(--black); }
    body { min-height: 100vh; display: flex; flex-direction: column; background: var(--black); color: var(--white); }
    .error-page {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: var(--space-16) 0;
    }
    .error-bg {
      position: absolute;
      inset: 0;
    }
    .error-bg-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: blur(2px) brightness(0.15);
    }
    .error-bg-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, rgba(201,162,39,0.08) 0%, transparent 65%),
                  linear-gradient(to bottom, rgba(17,17,17,0.6), rgba(17,17,17,0.9));
    }
    .error-content {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 700px;
      padding: 0 var(--space-6);
    }
    .error-code {
      font-family: var(--font-serif);
      font-size: clamp(6rem, 20vw, 14rem);
      font-weight: 300;
      line-height: 1;
      letter-spacing: -0.04em;
      background: var(--gradient-gold-h);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: var(--space-6);
      font-style: italic;
    }
    .error-divider {
      width: 60px;
      height: 1px;
      background: var(--gradient-gold-h);
      margin: 0 auto var(--space-8);
    }
    .error-title {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      color: var(--white);
      font-weight: 300;
      margin-bottom: var(--space-5);
    }
    .error-message {
      font-size: var(--fs-md);
      color: rgba(255,255,255,0.55);
      line-height: var(--lh-relaxed);
      max-width: 44ch;
      margin: 0 auto var(--space-10);
    }
    .error-actions {
      display: flex;
      gap: var(--space-4);
      justify-content: center;
      flex-wrap: wrap;
    }
    .error-links {
      display: flex;
      gap: var(--space-8);
      justify-content: center;
      margin-top: var(--space-12);
      flex-wrap: wrap;
    }
    .error-link {
      font-size: var(--fs-sm);
      color: rgba(255,255,255,0.35);
      text-decoration: none;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: color 0.2s;
    }
    .error-link:hover { color: var(--gold); }
    /* Floating particles */
    .error-particles { position: absolute; inset: 0; pointer-events: none; }
    .error-particle {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: rgba(201,162,39,0.4);
      animation: particleFloat 8s ease-in-out infinite;
    }
    @keyframes particleFloat {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.3; }
      50% { transform: translateY(-60px) scale(1.2); opacity: 0.6; }
    }
  </style>
</head>
<body>

<main class="error-page" aria-label="404 Page not found">

  <!-- Background -->
  <div class="error-bg" aria-hidden="true">
    <img class="error-bg-img" src="https://images.unsplash.com/photo-1738217383996-9947554e9f28?auto=format&fit=crop&w=1920&q=80" alt="" />
    <div class="error-bg-overlay"></div>
  </div>

  <!-- Particles -->
  <div class="error-particles" aria-hidden="true" id="errorParticles"></div>

  <!-- Content -->
  <div class="error-content" data-reveal="up">

    <div class="error-code">404</div>
    <div class="error-divider"></div>

    <h1 class="error-title">This Page Has Left the Building</h1>
    <p class="error-message">
      We couldn't find the page you were looking for. It may have moved, been renamed, or perhaps it never existed in the first place.
    </p>

    <div class="error-actions">
      <a href="index.html"   class="btn btn-primary btn-lg">Go to Homepage</a>
      <a href="contact.html" class="btn btn-ghost btn-lg">Contact Support</a>
    </div>

    <div class="error-links" aria-label="Quick navigation">
      <a href="about.html"    class="error-link">About</a>
      <a href="services.html" class="error-link">Services</a>
      <a href="gallery.html"  class="error-link">Gallery</a>
      <a href="contact.html"  class="error-link">Contact</a>
      <a href="login.html"    class="error-link">Sign In</a>
    </div>

  </div>
</main>

<script>
  // Generate particles
  const container = document.getElementById('errorParticles');
  for (let i = 0; i < 25; i++) {
    const p = document.createElement('div');
    p.className = 'error-particle';
    p.style.cssText = `
      left: ${Math.random() * 100}%;
      top: ${Math.random() * 100}%;
      animation-delay: ${Math.random() * 8}s;
      animation-duration: ${5 + Math.random() * 6}s;
      opacity: ${0.1 + Math.random() * 0.4};
    `;
    container.appendChild(p);
  }
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
